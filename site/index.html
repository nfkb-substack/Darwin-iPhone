<style>
:root { --fond:#f6f4ef; --carte:#fff; --texte:#1c1f22; --doux:#6a7077; --trait:#dedad2; --accent:#1f6f54; --accent-fond:#e3f0ea; --alerte:#9a3b1f; --alerte-fond:#fbeee8; }
@media (prefers-color-scheme: dark) { :root { --fond:#14181c; --carte:#1c2126; --texte:#e9e6df; --doux:#98a0a8; --trait:#2c333a; --accent:#7fd0ae; --accent-fond:#1d3329; --alerte:#f0a58c; --alerte-fond:#3a221b; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin:0; background:var(--fond); color:var(--texte); font: 16px/1.45 -apple-system, system-ui, sans-serif; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
button, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
header.barre { position: sticky; top: env(safe-area-inset-top); z-index: 5; background: var(--fond); border-bottom: 1px solid var(--trait); padding: 0 16px; height: 56px; display:flex; align-items:center; gap:10px; }
header.barre h1 { font: 600 17px/1.2 Georgia, serif; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { border: 1px solid var(--trait); background: var(--carte); border-radius: 10px; padding: 8px 12px; min-height: 40px; }

.btn.danger { color: var(--alerte); }
.btn[aria-pressed="true"] { background: var(--accent-fond); border-color: var(--accent); color: var(--accent); font-weight: 600; }
main { padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; }
.doux { color: var(--doux); font-size: 14px; }
input[type=search] { width: 100%; padding: 10px 12px; border: 1px solid var(--trait); border-radius: 10px; background: var(--carte); font-size: 16px; }
.filtres { display:flex; gap:8px; margin: 10px 0; flex-wrap: wrap; }
ul.liste { list-style: none; margin: 0; padding: 0; }
ul.liste li { border-bottom: 1px solid var(--trait); }
ul.liste a { display: block; padding: 10px 0; color: inherit; text-decoration: none; }

.pastille { display:inline-block; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 6px; margin-left: 4px; background: var(--accent-fond); color: var(--accent); }

.entete { display:flex; gap: 14px; align-items: flex-start; }
.entete img { width: 96px; height: 96px; border-radius: 10px; object-fit: cover; background: var(--trait); flex: none; }

#lecteur .cmd { display:flex; align-items:center; justify-content: center; gap: 10px; }

label.eco { display: flex; align-items: center; gap: 8px; margin: 12px 0 2px; min-height: 40px; }

.ok { color: var(--accent); font-weight: 700; }
input.cle { width: 100%; padding: 10px 12px; border: 1px solid var(--trait); border-radius: 10px; background: var(--carte); font: 14px/1.3 ui-monospace, Menlo, monospace; }
</style>

<body>
<header class="barre">
  <button class="btn" id="retour" hidden aria-label="Retour au catalogue">‹</button>
  <h1 id="titre">Sur les épaules de Darwin</h1>
  <button class="btn" id="versGestion" aria-label="Fichiers sur l'iPhone">Fichiers</button>
</header>
<main id="vue"><p class="doux">Chargement…</p></main>
<input type="file" id="choix" multiple hidden>
<audio id="audio" preload="metadata"></audio>
<script>
"use strict";
/* Darwin-iPhone : catalogue, résumé, lecteur et sous-titres, entièrement sur l'appareil.
   Les mp3 et les sous-titres sont importés une fois et gardés dans le stockage de la page (IndexedDB). */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const dateFr = d => { const [y, m, j] = d.split("-").map(Number); return `${j === 1 ? "1er" : j} ${MOIS[m - 1]} ${y}`; };
const hms = s => { if (!isFinite(s)) return "–"; s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
const taille = o => o > 1e9 ? (o / 1e9).toFixed(1).replace(".", ",") + " Go" : Math.round(o / 1e6) + " Mo";
const sansAccent = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const NOM = {m: "Monologue", o: "Original"};
const mem = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

/* ---------- stockage ---------- */
let bd;
function ouvrirBD() {
  return new Promise((ok, ko) => {
    const r = indexedDB.open("darwin-iphone", 2);
    r.onupgradeneeded = () => { const d = r.result; ["meta", "son", "pochette", "st", "pl"].forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); }); };
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  });
}
const req = r => new Promise((ok, ko) => { r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
const lire = (s, k) => req(bd.transaction(s).objectStore(s).get(k));
function ecrire(objets) {   // {magasin: [[clé, valeur], …]} ; valeur undefined = suppression
  return new Promise((ok, ko) => {
    const t = bd.transaction(Object.keys(objets), "readwrite");
    for (const [s, l] of Object.entries(objets)) for (const [k, v] of l) v === undefined ? t.objectStore(s).delete(k) : t.objectStore(s).put(v, k);
    t.oncomplete = () => ok(); t.onerror = t.onabort = () => ko(t.error);
  });
}
let LISTES = new Map();                     // nom du fichier -> {titre, items: [{n, k, lib}]}
let META = new Map(), ST = new Set();       // "m:313" -> {n, k, nom, o, notes, pochette} ; n° qui ont des sous-titres
async function chargerEtat() {
  const t = bd.transaction(["meta", "st", "pl"]);
  const [cles, vals, st, pc, pv] = await Promise.all([req(t.objectStore("meta").getAllKeys()), req(t.objectStore("meta").getAll()), req(t.objectStore("st").getAllKeys()), req(t.objectStore("pl").getAllKeys()), req(t.objectStore("pl").getAll())]);
  META = new Map(cles.map((k, i) => [k, vals[i]])); ST = new Set(st); LISTES = new Map(pc.map((k, i) => [k, pv[i]]));
}
const a = (n, k) => META.has(k + ":" + n);

/* ---------- catalogue ---------- */
let CAT = [], PAR_N = new Map(), REDIFFS = new Map();
async function chargerCatalogue() {
  const d = await (await fetch("catalogue.json")).json();
  CAT = d.eps; CAT.forEach(e => { PAR_N.set(e.n, e); if (e.p != null) { if (!REDIFFS.has(e.p)) REDIFFS.set(e.p, []); REDIFFS.get(e.p).push(e.n); } });
}
const premiere = e => e.p != null && PAR_N.get(e.p) || e;
const memes = e => { const p = premiere(e); return [p.n, ...(REDIFFS.get(p.n) || [])]; };   // même émission : première diffusion et rediffusions

/* ---------- lecture des étiquettes ID3 (pochette, notes) ---------- */
function texteID3(o, enc) {
  try { return new TextDecoder(["iso-8859-1", "utf-16", "utf-16be", "utf-8"][enc] || "utf-8").decode(o).replace(/\0+$/, ""); } catch (e) { return ""; }
}
function finChaine(o, p, enc) { const large = enc === 1 || enc === 2; for (let i = p; i < o.length - (large ? 1 : 0); i += large ? 2 : 1) if (o[i] === 0 && (!large || o[i + 1] === 0)) return [i, i + (large ? 2 : 1)]; return [o.length, o.length]; }
async function lireID3(f) {
  const out = {notes: "", pochette: null};
  try {
    const h = new Uint8Array(await f.slice(0, 10).arrayBuffer());
    if (h[0] !== 73 || h[1] !== 68 || h[2] !== 51) return out;
    const v = h[3], tot = (h[6] & 127) << 21 | (h[7] & 127) << 14 | (h[8] & 127) << 7 | (h[9] & 127);
    if (v < 3 || tot > 12e6) return out;
    const o = new Uint8Array(await f.slice(10, 10 + tot).arrayBuffer());
    let p = 0; const textes = {};
    while (p + 10 <= o.length && o[p] !== 0) {
      const id = String.fromCharCode(o[p], o[p + 1], o[p + 2], o[p + 3]);
      const t = v === 4 ? (o[p + 4] & 127) << 21 | (o[p + 5] & 127) << 14 | (o[p + 6] & 127) << 7 | (o[p + 7] & 127) : (o[p + 4] << 24 | o[p + 5] << 16 | o[p + 6] << 8 | o[p + 7]) >>> 0;
      if (!t || p + 10 + t > o.length) break;
      const c = o.subarray(p + 10, p + 10 + t), enc = c[0];
      if (id === "APIC" && !out.pochette) {
        const [f1, d1] = finChaine(c, 1, 0), mime = texteID3(c.subarray(1, f1), 0) || "image/jpeg";
        const [, d2] = finChaine(c, d1 + 1, enc);
        out.pochette = new Blob([c.slice(d2)], {type: mime.includes("/") ? mime : "image/" + mime});
      } else if (id === "USLT" || id === "COMM") {
        const [, d] = finChaine(c, 4, enc), tx = texteID3(c.subarray(d), enc).trim();
        if (tx && (!textes[id] || tx.length > textes[id].length)) textes[id] = tx;
      }
      p += 10 + t;
    }
    out.notes = [textes.COMM, textes.USLT].filter((x, i, l) => x && l.indexOf(x) === i).join("\n\n");
  } catch (e) {}
  return out;
}

/* ---------- import ---------- */
async function importerSousTitres(f, suivi) {
  // un épisode par ligne : {"n":313,"d":…,"o":[…],"s":[[t,"phrase"],…],"od":…}
  const lecteur = f.stream().getReader(), dec = new TextDecoder();
  let reste = "", nb = 0, lot = [];
  const vider = async () => { if (lot.length) { await ecrire({st: lot}); nb += lot.length; lot = []; suivi(`Sous-titres : ${nb} épisodes…`); } };
  const ligne = async l => { l = l.trim(); if (!l) return; const e = JSON.parse(l); if (!Number.isInteger(e.n) || !Array.isArray(e.s)) throw new Error("ligne inattendue"); lot.push([e.n, {d: e.d, o: e.o || [], s: e.s, od: e.od}]); if (lot.length >= 25) await vider(); };
  for (;;) {
    const {done, value} = await lecteur.read();
    reste += dec.decode(value || new Uint8Array(), {stream: !done});
    const l = reste.split("\n"); reste = l.pop();
    for (const x of l) await ligne(x);
    if (done) break;
  }
  await ligne(reste); await vider();
  return nb;
}
function lirePlaylist(texte, nom) {   // .m3u8 de l'index Darwin : une ligne par fichier, « …/313-monologue-….mp3 »
  let titre = nom.replace(/\.m3u8?$/i, "").replace(/^darwin-/, "").replace(/-/g, " "), lib = "";
  const items = [];
  for (let l of texte.split(/\r?\n/)) {
    l = l.trim(); if (!l) continue;
    if (l.startsWith("#PLAYLIST:")) titre = l.slice(10).trim() || titre;
    else if (l.startsWith("#EXTINF:")) lib = l.slice(l.indexOf(",") + 1).trim();
    else if (!l.startsWith("#")) {
      const m = /(?:^|[\/\\])(\d+)-(monologue|original)-[^\/\\]*\.mp3$/i.exec(decodeURIComponent(l.replace(/%(?![0-9a-f]{2})/gi, "%25")));
      if (m) items.push({n: +m[1], k: m[2].toLowerCase()[0], lib});
      lib = "";
    }
  }
  return {titre, items};
}
async function importer(fichiers) {
  const z = $("#import"), bilan = {sons: 0, st: 0, listes: 0, refus: []};
  const suivi = (t, v, max) => { if (z) z.innerHTML = `<p>${esc(t)}</p>${max ? `<progress value="${v}" max="${max}"></progress>` : ""}`; };
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  let i = 0;
  for (const f of fichiers) {
    i++;
    const m = /^(\d+)-(monologue|original)-.*\.mp3$/i.exec(f.name);
    try {
      if (m) {
        const n = +m[1], k = m[2].toLowerCase()[0], cle = k + ":" + n;
        suivi(`${i} / ${fichiers.length} : ${f.name}`, i - 1, fichiers.length);
        const id3 = await lireID3(f);
        await ecrire({son: [[cle, f]], pochette: [[cle, id3.pochette || undefined]], meta: [[cle, {n, k, nom: f.name, o: f.size, notes: id3.notes, pochette: !!id3.pochette}]]});
        bilan.sons++;
      } else if (/\.m3u8?$/i.test(f.name)) {
        const pl = lirePlaylist(await f.text(), f.name);
        if (!pl.items.length) bilan.refus.push(f.name + " : aucune émission reconnue dans cette playlist");
        else { await ecrire({pl: [[f.name, pl]]}); bilan.listes++; bilan.derniere = f.name; }
      } else if (/\.json$/i.test(f.name)) {
        bilan.eco = (bilan.eco || 0) + ecoLireFichier(await f.text()); bilan.ecoLu = true;
      } else if (/\.(ndjson|jsonl|txt)$/i.test(f.name)) {
        bilan.st += await importerSousTitres(f, suivi);
      } else bilan.refus.push(f.name + " : nom non reconnu (attendu : « 313-monologue-… .mp3 », « 313-original-… .mp3 », une playlist .m3u8, le fichier des sous-titres ou darwin-ecoutees.json)");
    } catch (e) {
      bilan.refus.push(f.name + " : " + (e && e.name === "QuotaExceededError" ? "plus assez de place sur l'iPhone" : "import impossible (" + (e && e.message || e) + ")"));
    }
  }
  await chargerEtat();
  mem.set("bilan", bilan);
  if (bilan.listes && !bilan.sons && !bilan.st && !bilan.refus.length) { mem.set("bilan", null); location.hash = "#l" + encodeURIComponent(bilan.derniere); return; }
  if (location.hash === "#listes") { location.hash = "#fichiers"; return; }
  afficher();
}

/* ---------- émissions écoutées ---------- */
// État gardé dans la page : {n: {d, m}} ; d = jour d'écoute "AAAA-MM-JJ", ou null si l'émission a été décochée ;
// m = date de modification (ms). Mêmes règles de fusion que le service api/ecoutees (api/_fusion.js) et que le site
// privé du Mac : deux écoutes -> jour le plus ancien ; sinon la modification la plus récente l'emporte.
const ecoFusion = (a, b) => !a ? b : !b ? a : a.d && b.d ? {d: a.d < b.d ? a.d : b.d, m: Math.max(a.m, b.m)} : b.m > a.m || (b.m === a.m && b.d) ? b : a;
function ecoPropre(E) {
  const o = {};
  if (E && typeof E === "object" && !Array.isArray(E)) for (const [n, x] of Object.entries(E)) {
    if (!/^\d{1,5}$/.test(n) || !x || typeof x !== "object") continue;
    o[n] = {d: typeof x.d === "string" && /^\d{4}-\d\d-\d\d$/.test(x.d) ? x.d : null, m: Number.isFinite(x.m) && x.m > 0 ? Math.floor(x.m) : 0};
  }
  return o;
}
let ECO = ecoPropre(mem.get("darwin-ecoutees2", {}));
const ecoJour = () => new Date().toLocaleDateString("sv-SE");
const ecoutee = n => ECO[n] && ECO[n].d || null;
const ecoNb = () => Object.values(ECO).filter(x => x.d).length;
function ecoMeler(E) {   // fusionne un état reçu (service ou fichier) ; rend le nombre d'émissions dont l'état a changé
  let k = 0;
  for (const [n, x] of Object.entries(E)) { const v = ecoFusion(ECO[n], x); if (!ECO[n] || v.d !== ECO[n].d || v.m !== ECO[n].m) { if (!ECO[n] || v.d !== ECO[n].d) k++; ECO[n] = v; } }
  mem.set("darwin-ecoutees2", ECO); return k;
}
function ecoPoser(n, oui) {
  if (!!ecoutee(n) === !!oui) return;
  ECO[n] = {d: oui ? ecoJour() : null, m: Date.now()}; mem.set("darwin-ecoutees2", ECO); ecoRafraichir(); synchroBientot();
}
function ecoLireFichier(texte) {   // darwin-ecoutees.json : version 2 {e: {n: {d, m}}} ou version 1 {ecoutees: {n: "AAAA-MM-JJ"}} (ajoute sans décocher)
  const j = JSON.parse(texte);
  if (!j || typeof j !== "object" || j.format !== "darwin-ecoutees") throw new Error("ce fichier .json n'est pas un historique d'écoute darwin-ecoutees.json");
  let k;
  if (j.v === 2 && j.e) k = ecoMeler(ecoPropre(j.e));
  else {
    const E = {}, t = Date.now();
    for (const [n, d] of Object.entries(j.ecoutees || {})) { if (!/^\d{1,5}$/.test(n) || typeof d !== "string" || !/^\d{4}-\d\d-\d\d/.test(d)) continue; const j2 = d.slice(0, 10), c = ecoutee(n); if (!c || j2 < c) E[n] = {d: j2, m: t}; }
    k = Object.keys(E).filter(n => !ecoutee(n)).length; Object.assign(ECO, E); mem.set("darwin-ecoutees2", ECO);
  }
  ecoRafraichir(); synchroBientot(); return k;
}
async function ecoExporter() {
  const f = new File([JSON.stringify({format: "darwin-ecoutees", v: 2, e: ECO}, null, 1)], "darwin-ecoutees.json", {type: "application/json"});
  try { if (navigator.canShare && navigator.canShare({files: [f]})) { await navigator.share({files: [f]}); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
let dessinerListe = null;
function ecoRafraichir() {   // après un changement (case, fin de lecture, synchronisation, import) : met à jour ce qui est affiché
  const m = /^#e(\d+)/.exec(location.hash), c = $("#eco");
  if (vueCourante === "ep" && m && c) { const d = ecoutee(+m[1]); c.checked = !!d; $("#ecoDate").textContent = d ? "(le " + dateFr(d) + ")" : ""; }
  else if (vueCourante === "liste" && dessinerListe && $("#liste")) dessinerListe();
  if ($("#ecoNb")) $("#ecoNb").textContent = ecoPhrase();
  if ($("#synEtat")) $("#synEtat").textContent = SYN.etat;
}
const ecoPhrase = () => { const k = ecoNb(); return k + " émission" + (k > 1 ? "s écoutées" : " écoutée") + " en entier."; };

/* ---------- synchronisation de l'historique d'écoute (service api/ecoutees du même site) ---------- */
// La clé est celle du projet Vercel (« Protection Bypass for Automation »), collée une fois dans Fichiers ; sans clé,
// l'appel passe tant que la connexion Vercel de la page est valide. Sans réseau, rien ne se perd : l'état reste dans
// la page et part à la synchronisation suivante.
const SYN = {etat: "", enCours: false, encore: false, minuteur: 0, dernier: 0};
function synchroBientot() { clearTimeout(SYN.minuteur); SYN.minuteur = setTimeout(synchro, 1500); }
async function synchro() {
  if (SYN.enCours) { SYN.encore = true; return; }
  if (navigator.onLine === false) { SYN.etat = "Hors ligne : la synchronisation se fera au retour du réseau."; ecoRafraichir(); return; }
  SYN.enCours = true; clearTimeout(SYN.minuteur);
  const cle = mem.get("darwin-synchro-cle", "");
  try {
    const r = await fetch("api/ecoutees" + (cle ? "?x-vercel-protection-bypass=" + encodeURIComponent(cle) : ""), {method: "POST", headers: {"content-type": "text/plain"}, body: JSON.stringify({format: "darwin-ecoutees", v: 2, e: ECO}), cache: "no-store", redirect: "error"});
    if (!r.ok || !/json/.test(r.headers.get("content-type") || "")) throw Object.assign(new Error("refus"), {code: r.status});
    const j = await r.json(); if (!j || j.v !== 2) throw new Error("réponse inattendue");
    ecoMeler(ecoPropre(j.e)); SYN.dernier = Date.now();
    SYN.etat = "Synchronisé à " + new Date().toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"}) + ".";
  } catch (e) {
    SYN.etat = navigator.onLine === false ? "Hors ligne : la synchronisation se fera au retour du réseau."
      : e && e.code >= 500 ? "Le service de synchronisation ne répond pas ; nouvel essai plus tard."
      : cle ? "Synchronisation impossible : réseau absent ou clé refusée." : "Pas de synchronisation : collez la clé ci-dessous (ou reconnectez-vous à Vercel).";
  }
  SYN.enCours = false; ecoRafraichir();
  if (SYN.encore) { SYN.encore = false; synchroBientot(); }
}
addEventListener("online", synchro);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - SYN.dernier > 60000) synchro(); });

    pan.querySelectorAll("[data-v]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === v)));
    const q = pan.querySelector("#vitQui"); if (q) q.textContent = !seuil() ? "Vitesse de toutes les émissions." : debut() ? `Vitesse des émissions n° 1 à ${seuil()}.` : `Vitesse des émissions à partir du n° ${seuil() + 1}.`;
  };
  pan.innerHTML = `<p class="doux" id="vitQui"></p><div class="vits">${VITESSES.map(v => `<button class="btn" data-v="${v}" aria-pressed="false">${fmt(v)}</button>`).join("")}</div>
    <p class="doux"><label>Émissions du début, avec leur propre vitesse : jusqu'au n° <input id="vitN" type="number" inputmode="numeric" min="0" max="999" placeholder="aucune" value="${seuil() || ""}"></label></p>`;
  pan.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { const v = +b.dataset.v; mem.set(debut() ? "vitP" : "vit", v); poserVit(v); pan.hidden = true; vit.setAttribute("aria-expanded", "false"); });   // se referme : le lecteur est collé en haut de l'écran
  $("#vitN").onchange = ev => { const x = Math.floor(+ev.target.value); mem.set("vitN", x > 0 ? x : 0); ev.target.value = x > 0 ? x : ""; poserVit(vitesseDe()); };
  vit.onclick = () => { pan.hidden = !pan.hidden; vit.setAttribute("aria-expanded", String(!pan.hidden)); };
  poserVit(vitesseDe());
  const c = $("#curseur");
  c.oninput = () => { c.dataset.tenu = "1"; $("#tps").textContent = hms(+c.value); };
  c.onchange = () => { audio.currentTime = +c.value; delete c.dataset.tenu; };
  if ($("#st")) $("#st").onclick = ev => { const p = ev.target.closest("p[data-i]"); if (!p || !EN_COURS.st) return; audio.currentTime = depuisMono(EN_COURS.st.s[+p.dataset.i][0]); defilementManuel = 0; audio.play().catch(() => {}); };
  EN_COURS.ligne = -2; majLecteur();
}
async function vueFichiers() {
  $("#titre").textContent = "Fichiers sur l'iPhone"; $("#retour").hidden = false; $("#versGestion").hidden = true;
  const l = [...META.values()].sort((x, y) => x.n - y.n || (x.k < y.k ? -1 : 1)), tot = l.reduce((s, m) => s + m.o, 0);
  let place = "";
  try { const e = await navigator.storage.estimate(); if (e && e.quota) place = ` Place encore utilisable par la page : environ ${taille(Math.max(0, e.quota - e.usage))}.`; } catch (x) {}
  const bilan = mem.get("bilan", null); mem.set("bilan", null);
  const rayon = k => { const r = l.filter(m => m.k === k); return `<h3>${k === "m" ? "Monologues" : "Originaux"} (${r.length})</h3>${r.length ? `<table class="fichiers">${r.map(m => `<tr><td><a class="lien" href="#e${m.n}${m.k}">n° ${m.n}</a> ${esc((PAR_N.get(m.n) || {}).t || m.nom)}</td><td>${taille(m.o)} <button class="btn danger" data-suppr="${m.k}:${m.n}" aria-label="Supprimer">✕</button></td></tr>`).join("")}</table>` : `<p class="doux">Aucun.</p>`}`; };
  $("#vue").innerHTML = `${bilan ? `<div class="${bilan.refus.length ? "message" : "info"}">Import terminé : ${bilan.sons} fichier${bilan.sons > 1 ? "s" : ""} audio${bilan.st ? `, sous-titres de ${bilan.st} émissions` : ""}${bilan.listes ? `, ${bilan.listes} playlist${bilan.listes > 1 ? "s" : ""}` : ""}${bilan.ecoLu ? `, historique d'écoute (${bilan.eco} émission${bilan.eco > 1 ? "s ajoutées" : " ajoutée"})` : ""}.${bilan.refus.length ? `<br>Non importés :<br>${bilan.refus.map(esc).join("<br>")}` : ""}</div>` : ""}
    <p>Choisissez dans l'app Fichiers les mp3 à écouter (monologues et originaux, reconnus à leur nom) et, une seule fois, le fichier des sous-titres <b>sous-titres-darwin.ndjson</b>. Les playlists <b>.m3u8</b> de l'index s'importent de la même façon. Tout est copié dans cette page : vous pouvez ensuite supprimer ces fichiers de Fichiers.</p>
    <p><button class="btn plein" id="importer">Importer des fichiers…</button></p><div id="import"></div>
    <p class="doux">${l.length} fichier${l.length > 1 ? "s" : ""} audio, ${taille(tot)}. Sous-titres : ${ST.size} émission${ST.size > 1 ? "s" : ""}.${place}</p>
    ${rayon("m")}${rayon("o")}
    <h3>Émissions écoutées</h3>
    <p><span id="ecoNb">${ecoPhrase()}</span> Elles sont partagées avec le site privé du Mac. <span class="doux" id="synEtat">${esc(SYN.etat)}</span></p>
    <p><button class="btn" id="synGo">Synchroniser</button> <button class="btn" id="ecoExp">Exporter</button></p>
    <details ${mem.get("darwin-synchro-cle", "") ? "" : "open"}><summary>Clé de synchronisation</summary>
      <p class="doux">Clé du projet Vercel darwin-iphone (Settings › Deployment Protection › Protection Bypass for Automation), la même que sur le Mac. Elle reste sur cet iPhone.</p>
      <p><input class="cle" id="synCle" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Coller la clé" value="${esc(mem.get("darwin-synchro-cle", ""))}"></p>
      <p><button class="btn" id="synCleOk">Enregistrer la clé</button></p></details>
    <p class="doux">Secours sans réseau : « Exporter » produit darwin-ecoutees.json, qui s'importe ici comme les autres fichiers et dans le site privé.</p>
    <h3>Ménage</h3><p><button class="btn danger" id="toutSon">Supprimer tous les fichiers audio</button> <button class="btn danger" id="toutSt">Supprimer les sous-titres</button></p>
    <p class="doux">Pour que l'iPhone ne vide pas ce stockage, ouvrez la page depuis l'écran d'accueil (bouton de partage de Safari, puis « Sur l'écran d'accueil »).</p>`;
  $("#importer").onclick = () => $("#choix").click();
  $("#synGo").onclick = () => { SYN.etat = "Synchronisation…"; ecoRafraichir(); synchro(); };
  $("#ecoExp").onclick = ecoExporter;
  $("#synCleOk").onclick = () => { mem.set("darwin-synchro-cle", $("#synCle").value.trim()); $("#synGo").click(); };
  document.querySelectorAll("[data-suppr]").forEach(b => b.onclick = async () => { const c = b.dataset.suppr; if (EN_COURS && EN_COURS.cle === c) fermerSon(); await ecrire({son: [[c]], pochette: [[c]], meta: [[c]]}); await chargerEtat(); vueFichiers(); });
  $("#toutSon").onclick = async () => { if (!confirm("Supprimer tous les fichiers audio de cette page ?")) return; fermerSon(); await new Promise(ok => { const t = bd.transaction(["son", "pochette", "meta"], "readwrite"); ["son", "pochette", "meta"].forEach(s => t.objectStore(s).clear()); t.oncomplete = ok; }); await chargerEtat(); vueFichiers(); };
  $("#toutSt").onclick = async () => { if (!confirm("Supprimer les sous-titres de cette page ?")) return; await new Promise(ok => { const t = bd.transaction("st", "readwrite"); t.objectStore("st").clear(); t.oncomplete = ok; }); await chargerEtat(); vueFichiers(); };
}
let vueCourante = "";
function afficher() {
  const h = location.hash, m = /^#e(\d+)([mo])?$/.exec(h);
  if (vueCourante === "liste" && h !== "" && h !== "#") mem.set("defil", scrollY);
  if (m) { vueCourante = "ep"; scrollTo(0, 0); vueEpisode(+m[1], m[2]); }
  else if (h === "#fichiers") { vueCourante = "fichiers"; scrollTo(0, 0); vueFichiers(); }
  else if (h === "#listes") { vueCourante = "listes"; scrollTo(0, 0); vueListes(); }
  else if (h.startsWith("#l")) { vueCourante = "pl"; scrollTo(0, 0); vuePlaylist(decodeURIComponent(h.slice(2))); }
  else { vueCourante = "liste"; vueListe(); }
}
$("#retour").onclick = () => {
  const m = /^#e(\d+)/.exec(location.hash), c = m && contexte(+m[1]);
  location.hash = c ? "#l" + encodeURIComponent(c.id) : vueCourante === "pl" ? "#listes" : "";
};
$("#versGestion").onclick = () => { location.hash = "#fichiers"; };
$("#choix").onchange = ev => { const f = [...ev.target.files]; ev.target.value = ""; if (f.length) importer(f); };
addEventListener("hashchange", afficher);
addEventListener("pagehide", () => { if (EN_COURS) mem.set("pos:" + EN_COURS.cle, Math.floor(audio.currentTime)); });
(async () => {
  try { bd = await ouvrirBD(); await Promise.all([chargerEtat(), chargerCatalogue()]); afficher(); }
  catch (e) { $("#vue").innerHTML = `<div class="message">La page n'a pas pu démarrer (${esc(e && e.message || e)}). En navigation privée, le stockage est désactivé : ouvrez la page dans un onglet normal.</div>`; }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  synchro();
})();
</script>
